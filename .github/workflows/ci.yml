name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests and oracle checks
        run: python -m unittest -v
      - name: Validate complete benchmark corpus
        run: python benchmark.py --repeats 1 --output /tmp/pathfinding-results.csv
      - name: Verify committed illustration is reproducible
        run: |
          python visualize.py demo.map --output /tmp/demo-route.svg
          diff demo-route.svg /tmp/demo-route.svg
